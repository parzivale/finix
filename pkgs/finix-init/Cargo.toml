[package]
name = "finix-init"
version = "0.1.0"
edition = "2021"
description = "PID 1 preamble: prepare /, activate the configuration, exec the service manager"
license = "MIT"

[dependencies]
# syscalls rather than commands. This runs before anything has mounted the store on one boot
# path, so it cannot call mount(8) - and on the other it is PID 1, where forking a coreutils to
# make a symlink is a process to reap for no reason.
rustix = { version = "0.38", default-features = false, features = ["std", "fs", "mount", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# a panic in PID 1 that unwinds is a kernel panic with a worse message. Abort, and let the hook
# installed in main say something useful first.
panic = "abort"

# `s`, measured against `z`. `z` is the more aggressive of the two and made this *larger* -
# 652k against 634k - because it turns off loop vectorisation, and with LTO on that costs more
# elsewhere than it saves. Stripping is where the size actually is: see stripAllList in
# default.nix, which takes 634k to 463k.
opt-level = "s"
lto = true
